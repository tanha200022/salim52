name: Build Android APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - run: python3 tests/check_schema.py
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace --console=plain
      - uses: actions/upload-artifact@v6
        with:
          name: OrderBook-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
